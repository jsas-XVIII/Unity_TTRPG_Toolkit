stages:
  - validate
  - test
  - build

# Reusable rule sets
.rules_all_mr: &rules_all_mr
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "Development"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_gate_mr: &rules_gate_mr
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "Development"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "Development")'

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - character-sheet/package-lock.json
    paths:
      - character-sheet/node_modules/

validate-commits:
  stage: validate
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  cache: {}
  script:
    - |
      PATTERN='^(feat|fix|test|chore|docs|refactor|style|perf|ci)(\(.+\))?: .+'
      FAILED=0
      git log origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..HEAD --no-merges --pretty=format:"%s" > /tmp/commits.txt
      if [ ! -s /tmp/commits.txt ]; then
        echo "No commits to validate."
        exit 0
      fi
      while IFS= read -r msg; do
        echo "Checking: $msg"
        if ! echo "$msg" | grep -qE "$PATTERN"; then
          echo "ERROR: Commit message does not follow convention: '$msg'"
          echo "Required format: <type>(<scope>): <description>"
          echo "Allowed types: feat, fix, test, chore, docs, refactor, style, perf, ci"
          FAILED=1
        fi
      done < /tmp/commits.txt
      exit $FAILED
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Install dependencies — shared across all jobs via cache
install:
  stage: validate
  script:
    - cd character-sheet
    - npm ci
  artifacts:
    paths:
      - character-sheet/node_modules/
    expire_in: 1 hour
  <<: *rules_all_mr

lint:
  stage: validate
  needs: [install]
  script:
    - cd character-sheet
    - npm run lint
  <<: *rules_all_mr

typecheck:
  stage: validate
  needs: [install]
  script:
    - cd character-sheet
    - npm run typecheck
  <<: *rules_all_mr

audit:
  stage: validate
  cache: {}
  script:
    - cd character-sheet
    - npm audit --audit-level=high
  <<: *rules_all_mr

# E2e only runs on MRs targeting main/Development, and on direct pushes to those branches.
# Feature branch MRs skip this job — lint + typecheck + unit tests are sufficient there.
test:e2e:
  stage: test
  image: cypress/browsers:node-22.12.0-chrome-131.0.6778.139-1-ff-133.0.3-edge-131.0.2903.99-1
  needs: [lint]
  variables:
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cypress-cache"
    CYPRESS_BASE_URL: "http://localhost:4173"
  cache:
    key:
      prefix: cypress
      files:
        - character-sheet/package-lock.json
    paths:
      - character-sheet/node_modules/
      - .cypress-cache/
  script:
    - cd character-sheet
    - npm ci
    - npm run build
    - npm run preview -- --host &
    - npx wait-on http://127.0.0.1:4173 --timeout 30000
    - npm run cy:run -- --browser chrome
  artifacts:
    when: always
    paths:
      - character-sheet/cypress/screenshots/
    expire_in: 3 days
  <<: *rules_gate_mr

test:unit:
  stage: test
  needs: [install]
  script:
    - cd character-sheet
    - npm run test:unit
  <<: *rules_all_mr

# Build only runs on MRs targeting main/Development, and on direct pushes to those branches.
build:
  stage: build
  needs: [install, lint, typecheck, test:e2e, test:unit]
  script:
    - cd character-sheet
    - npm run build
  artifacts:
    paths:
      - character-sheet/dist/
    expire_in: 1 week
  <<: *rules_gate_mr
