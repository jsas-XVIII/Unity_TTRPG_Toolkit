stages:
  - validate
  - test
  - build

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - character-sheet/package-lock.json
    paths:
      - character-sheet/node_modules/

validate-commits:
  stage: validate
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  cache: {}
  script:
    - |
      PATTERN='^(feat|fix|test|chore|docs|refactor|style|perf|ci)(\(.+\))?: .+'
      FAILED=0
      git log origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}..HEAD --no-merges --pretty=format:"%s" > /tmp/commits.txt
      if [ ! -s /tmp/commits.txt ]; then
        echo "No commits to validate."
        exit 0
      fi
      while IFS= read -r msg; do
        echo "Checking: $msg"
        if ! echo "$msg" | grep -qE "$PATTERN"; then
          echo "ERROR: Commit message does not follow convention: '$msg'"
          echo "Required format: <type>(<scope>): <description>"
          echo "Allowed types: feat, fix, test, chore, docs, refactor, style, perf, ci"
          FAILED=1
        fi
      done < /tmp/commits.txt
      exit $FAILED
  only:
    - merge_requests

# Install dependencies — shared across all jobs via cache
install:
  stage: validate
  script:
    - cd character-sheet
    - npm ci
  artifacts:
    paths:
      - character-sheet/node_modules/
    expire_in: 1 hour
  only:
    - main
    - merge_requests

lint:
  stage: validate
  needs: [install]
  script:
    - cd character-sheet
    - npm run lint
  only:
    - main
    - merge_requests

test:e2e:
  stage: test
  image: cypress/browsers:node-22.12.0-chrome-131.0.6778.139-1-ff-133.0.3-edge-131.0.2903.99-1
  needs: [lint]
  variables:
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cypress-cache"
    CYPRESS_BASE_URL: "http://localhost:4173"
  cache:
    key:
      prefix: cypress
      files:
        - character-sheet/package-lock.json
    paths:
      - character-sheet/node_modules/
      - .cypress-cache/
  script:
    - cd character-sheet
    - npm ci
    - npm run build
    - npm run test:e2e:ci -- --browser chrome
  only:
    - main
    - merge_requests

build:
  stage: build
  needs: [install, lint, test:e2e]
  script:
    - cd character-sheet
    - npm run build
  artifacts:
    paths:
      - character-sheet/dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests
